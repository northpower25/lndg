name: Build python-deps base image

on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      deps_hash: ${{ steps.hash.outputs.deps_hash }}
      deps_image: ${{ steps.image.outputs.deps_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute deps hash
        id: hash
        run: |
          DEPS_HASH=$(sha256sum requirements.txt Dockerfile | sha256sum | cut -c1-16)
          echo "deps_hash=$DEPS_HASH" >> $GITHUB_OUTPUT

      - name: Set image name
        id: image
        run: |
          RAW="${GITHUB_REPOSITORY#*/}"
          DEPS_IMAGE="ghcr.io/${{ github.repository_owner }}/${RAW//docker-/}-python-deps"
          echo "deps_image=$DEPS_IMAGE" >> $GITHUB_OUTPUT

  build:
    needs: setup
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
          - platform: linux/arm/v7
            suffix: armv7

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push python-deps image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: python-deps-builder
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.setup.outputs.deps_image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=python-deps-${{ github.repository_id }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=python-deps-${{ github.repository_id }}-${{ matrix.suffix }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.suffix }}

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-deps-digests-${{ matrix.suffix }}
          path: /tmp/digests/${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: [setup, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download digest artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: python-deps-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Validate digest artifacts
        run: |
          shopt -s nullglob
          digest_files=(/tmp/digests/*)
          if [ "${#digest_files[@]}" -eq 0 ]; then
            echo "No digest files found in /tmp/digests" >&2
            exit 1
          fi

          for digest_file in "${digest_files[@]}"; do
            digest_value="$(tr -d '[:space:]' < "$digest_file")"
            if ! [[ "$digest_value" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid digest in $digest_file: $digest_value" >&2
              exit 1
            fi
          done

      - name: Create multi-arch manifests
        run: |
          shopt -s nullglob
          DEPS_IMAGE="${{ needs.setup.outputs.deps_image }}"
          DEPS_HASH="${{ needs.setup.outputs.deps_hash }}"
          digest_files=(/tmp/digests/*)
          DIGEST_ARGS=()
          for digest_file in "${digest_files[@]}"; do
            DIGEST_ARGS+=("${DEPS_IMAGE}@$(tr -d '[:space:]' < "$digest_file")")
          done
          docker buildx imagetools create \
            --tag "${DEPS_IMAGE}:latest" \
            --tag "${DEPS_IMAGE}:${DEPS_HASH}" \
            "${DIGEST_ARGS[@]}"

      - name: Write resolved tag to summary
        run: |
          DEPS_IMAGE="${{ needs.setup.outputs.deps_image }}"
          DEPS_HASH="${{ needs.setup.outputs.deps_hash }}"
          echo "python-deps image: \`${DEPS_IMAGE}:${DEPS_HASH}\`" >> $GITHUB_STEP_SUMMARY

      - name: Make package public
        continue-on-error: true
        run: |
          PKG_NAME="$(basename "${{ needs.setup.outputs.deps_image }}")"
          gh api --method PATCH "/user/packages/container/${PKG_NAME}" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
