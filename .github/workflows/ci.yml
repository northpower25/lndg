name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: Prepare minimal test environment
        run: |
          mkdir -p /tmp/lnd
          touch /tmp/lnd/tls.cert /tmp/lnd/admin.macaroon /tmp/lnd/channel.db
          python initialize.py --tlscert /tmp/lnd/tls.cert --macaroon /tmp/lnd/admin.macaroon --lnddatabase /tmp/lnd/channel.db --force

      - name: Run lint
        run: make lint

      - name: Run migration check
        run: make check

      - name: Run tests
        run: make test

  test-frontend:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check for frontend package.json
        id: check_pkg
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        if: steps.check_pkg.outputs.exists == 'true'
        run: make frontend-install

      - name: Build frontend SPA
        if: steps.check_pkg.outputs.exists == 'true'
        run: make frontend-build

      - name: Run frontend lint (if configured)
        if: steps.check_pkg.outputs.exists == 'true'
        run: make frontend-lint
