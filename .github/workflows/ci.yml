name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: Prepare minimal test environment
        run: |
          mkdir -p /tmp/lnd
          touch /tmp/lnd/tls.cert /tmp/lnd/admin.macaroon /tmp/lnd/channel.db
          python initialize.py --tlscert /tmp/lnd/tls.cert --macaroon /tmp/lnd/admin.macaroon --lnddatabase /tmp/lnd/channel.db --force

      - name: Run lint
        run: make lint

      - name: Run migration check
        run: make check

      - name: Run tests
        run: make test
