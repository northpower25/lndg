name: Docker publish reusable

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        type: string
      build_target:
        description: 'Dockerfile target stage to build (default: final)'
        required: false
        type: string
        default: final
      tag_suffix:
        description: Suffix appended to image tags (e.g. '-ml' for the ML flavor)
        required: false
        type: string
        default: ''
      python_deps_image:
        description: >
          Full reference to the pre-built python-deps base image
          (e.g. ghcr.io/owner/lndg-python-deps:abc123).
          Leave empty to use the latest tag derived from the repository owner.
        required: false
        type: string
        default: ''
      exclude_armv7:
        description: Skip linux/arm/v7 platform build in the matrix.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-platform:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-22.04
    if: ${{ matrix.platform != 'linux/arm/v7' || !inputs.exclude_armv7 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
          - platform: linux/arm/v7
            suffix: armv7
    env:
      CACHE_SCOPE: docker-${{ github.repository_id }}-${{ matrix.suffix }}${{ inputs.tag_suffix }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set env variables
        run: |
          RAW_IMAGE_NAME="${GITHUB_REPOSITORY#*/}"
          IMAGE_NAME="${RAW_IMAGE_NAME//docker-/}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@v3

      - name: Normalize python-deps image input
        id: deps_image
        run: |
          value="$(printf '%s' '${{ inputs.python_deps_image }}' | xargs)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build and push architecture image by digest (cached python-deps image)
        id: build_cached
        if: steps.deps_image.outputs.value != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: ${{ inputs.build_target }}
          build-args: |
            PYTHON_DEPS_IMAGE=${{ steps.deps_image.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Build and push architecture image by digest (Dockerfile fallback)
        id: build_local
        if: steps.deps_image.outputs.value == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: ${{ inputs.build_target }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build_cached.outcome == 'success' && steps.build_cached.outputs.digest || steps.build_local.outputs.digest }}" > /tmp/digests/${{ matrix.suffix }}

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Merge multi-arch manifests
    runs-on: ubuntu-22.04
    needs: build-platform

    steps:
      - name: Set env variables
        run: |
          RAW_IMAGE_NAME="${GITHUB_REPOSITORY#*/}"
          IMAGE_NAME="${RAW_IMAGE_NAME//docker-/}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@v3

      - name: Download digest artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Validate digest artifacts
        run: |
          shopt -s nullglob
          digest_files=(/tmp/digests/*)
          if [ "${#digest_files[@]}" -eq 0 ]; then
            echo "No digest files found in /tmp/digests" >&2
            exit 1
          fi

          for digest_file in "${digest_files[@]}"; do
            digest_value="$(tr -d '[:space:]' < "$digest_file")"
            if ! [[ "$digest_value" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid digest in $digest_file: $digest_value" >&2
              exit 1
            fi
          done

      - name: Create multi-arch manifests
        run: |
          shopt -s nullglob
          digest_files=(/tmp/digests/*)
          if [ "${#digest_files[@]}" -eq 0 ]; then
            echo "No digest files found in /tmp/digests" >&2
            exit 1
          fi

          DIGEST_ARGS=()
          for digest_file in "${digest_files[@]}"; do
            DIGEST_ARGS+=("${IMAGE}@$(tr -d '[:space:]' < "$digest_file")")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:${{ inputs.tag }}${{ inputs.tag_suffix }}" \
            --tag "${IMAGE}:latest${{ inputs.tag_suffix }}" \
            "${DIGEST_ARGS[@]}"

      - name: Make package public
        continue-on-error: true
        run: |
          gh api --method PATCH "/user/packages/container/${IMAGE_NAME}" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
