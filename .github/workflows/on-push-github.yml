name: Build on release

permissions:
  packages: write

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set env variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          fi
          IMAGE_NAME="${GITHUB_REPOSITORY#*/}"
          echo "IMAGE_NAME=${IMAGE_NAME//docker-/}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$GHCR_PASSWORD" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Failed to login to ghcr.io after $attempt attempts" >&2
              exit 1
            fi

            echo "ghcr.io login failed on attempt $attempt, retrying..." >&2
            sleep $((attempt * 5))
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        id: qemu

      - name: Setup Docker buildx action
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Run Docker buildx
        run: |
          docker buildx build \
          --platform linux/amd64,linux/arm64,linux/arm/v7 \
          --tag ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:$TAG \
          --tag ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:latest \
          --output "type=registry" ./

      - name: Make package public
        continue-on-error: true
        run: |
          gh api --method PATCH /user/packages/container/$IMAGE_NAME \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
