name: Build on tag

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.12.0)'
        required: true

jobs:
  build:
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
