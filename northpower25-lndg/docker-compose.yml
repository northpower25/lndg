version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: northpower25-lndg_web_1
      APP_PORT: 8000

  web:
    image: ghcr.io/northpower25/lndg:latest
    restart: on-failure
    stop_grace_period: 1m
    user: "0:0"
    volumes:
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
      - ${APP_DATA_DIR}/data:/lndg/data:rw
    environment:
      - LND_TLS_PATH=/lnd/tls.cert
      - LND_MACAROON_PATH=/lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/admin.macaroon
      - LND_RPC_SERVER=${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_GRPC_PORT}
      - LND_NETWORK=${APP_BITCOIN_NETWORK}
      - APP_PASSWORD=${APP_PASSWORD}
    command:
      - sh
      - -c
      - >
        mkdir -p /lndg/data &&
        touch /lndg/data/db.sqlite3 /lndg/data/lndg-controller.log &&
        chown lndg:lndg /lndg/data /lndg/data/db.sqlite3 /lndg/data/lndg-controller.log &&
        exec su lndg -s /bin/sh -c "python initialize.py
        -tls /lnd/tls.cert
        -mcrn /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/admin.macaroon
        -rpc ${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_GRPC_PORT}
        -net \"${APP_BITCOIN_NETWORK}\"
        -wn &&
        python controller.py runserver 0.0.0.0:8000 > /lndg/data/lndg-controller.log 2>&1"
    ports: []
