manifestVersion: 1
id: northpower25-lndg
category: lightning
name: LNDg advanced
version: "1.10.8"
tagline: Lite GUI web interface to interact with your LND node
description: >-
  LNDg is a lite GUI web interface designed to assist users with operating their LND node
  and automating common tasks. It provides a dashboard, channel management, auto-fee logic
  (autopilot), auto-rebalancing, payment/invoice tracking, and much more.

  Key features:
  - Dashboard with real-time channel statistics and liquidity overview
  - Automated fee management (Autofees) based on routing activity
  - Automated channel rebalancing
  - Forward, payment, and invoice history
  - Failed HTLC analysis for routing optimization
  - Peer event tracking
  - Onchain balance management and batch channel opening
developer: northpower25
website: https://github.com/northpower25/lndg
dependencies:
  - lightning
repo: https://github.com/northpower25/lndg
support: https://github.com/northpower25/lndg/issues
port: 8890
icon: https://raw.githubusercontent.com/northpower25/lndg/master/northpower25-lndg/icon.svg
gallery:
  - https://user-images.githubusercontent.com/38626122/148699177-d10d412e-641e-4676-acac-2047e7e2d7a6.png
  - https://user-images.githubusercontent.com/38626122/148699209-667936fd-c56f-484f-8dd4-75e052c8c14f.png
  - https://user-images.githubusercontent.com/38626122/150556928-bb8772fb-14c4-4b7a-865e-a8350aac7f83.png
releaseNotes: >-
  v1.10.7: Fix missing naturaltime template filter (resolves 500 errors on /fees/, /advanced/,
  /autopilot/, /opens/, /keysends/ and template errors on /closures/, /autofees/, /inbound-fee-log/).
  Fix log file path for Docker deployments. Always write initial password to data/lndg-admin.txt.
path: ""
defaultUsername: "lndg-admin"
defaultPassword: "See /lndg/data/lndg-admin.txt"
submitter: northpower25
submission: https://github.com/northpower25/lndg
