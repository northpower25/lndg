manifestVersion: 1
id: northpower25-lndg
category: lightning
name: LNDg advanced
version: "1.12.1"
tagline: Lite GUI web interface to interact with your LND node
description: >-
  LNDg is an advanced GUI web interface designed to operate and automate modern Lightning node
  workflows. It includes dashboard analytics, channel and fee management, policy automation,
  recommendations, backup/restore and cleaner tooling, CLN capability-based foundations, and
  optional ML shadow-mode signals.

  Key features:
  - Cockpit dashboard with charts, snapshots, and liquidity overview
  - API v2 foundations (capabilities, cleaner, backup, recommendations, policies, splice, ML)
  - Automated fee management and policy-bound execution via audit-aware executor
  - Recommendation engine with rationale and confidence labels
  - Guided splice workflow and CLN plugin/capability panel
  - Retention/maintenance cleaner and backup workflows
  - Optional ML approaches (shadow predictions and auto-fee suggestions with ML flavor image)
developer: northpower25
website: https://github.com/northpower25/lndg
dependencies:
  - lightning
repo: https://github.com/northpower25/lndg
support: https://github.com/northpower25/lndg/issues
port: 8890
icon: https://raw.githubusercontent.com/northpower25/lndg/master/northpower25-lndg/icon.svg
gallery:
  - https://user-images.githubusercontent.com/38626122/148699177-d10d412e-641e-4676-acac-2047e7e2d7a6.png
  - https://user-images.githubusercontent.com/38626122/148699209-667936fd-c56f-484f-8dd4-75e052c8c14f.png
  - https://user-images.githubusercontent.com/38626122/150556928-bb8772fb-14c4-4b7a-865e-a8350aac7f83.png
releaseNotes: >-
  v1.12.0: Umbrel metadata updated to reflect the current refactoring status (LNDg Next).
  Includes capability-based backend architecture foundations, API v2 expansion (cleaner/backup/
  recommendations/policies/splice/ML), policy executor with audit trail integration, periodic
  collector/aggregator/cleaner/policy jobs, and Phase-6 ML approaches (shadow-mode predictions,
  per-channel ML toggles, optional ML image support).
path: ""
defaultUsername: "lndg-admin"
defaultPassword: $APP_PASSWORD
submitter: northpower25
submission: https://github.com/northpower25/lndg
