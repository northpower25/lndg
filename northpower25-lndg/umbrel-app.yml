manifestVersion: 1
id: northpower25-lndg
category: lightning
name: LNDg advanced
version: "v1.12.13"
tagline: Lite GUI web interface to interact with your LND node
description: >-
  LNDg is an advanced GUI web interface designed to operate and automate modern Lightning node
  workflows. It includes dashboard analytics, channel and fee management, policy automation,
  recommendations, backup/restore and cleaner tooling, CLN capability-based foundations, and
  full ML features (shadow predictions and auto-fee suggestions) now built in by default.

  Key features:
  - Cockpit dashboard with charts, snapshots, and liquidity overview
  - API v2 foundations (capabilities, cleaner, backup, recommendations, policies, splice, ML)
  - Automated fee management and policy-bound execution via audit-aware executor
  - Recommendation engine with rationale and confidence labels
  - Guided splice workflow and CLN plugin/capability panel
  - Retention/maintenance cleaner and backup workflows
  - Dedicated ML Settings page: global AI mode, escalation config, per-channel ML toggles
  - ML dependencies (scikit-learn/joblib) now included in the default Umbrel image
developer: northpower25
website: https://github.com/northpower25/lndg
